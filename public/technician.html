<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SkillCat — Technician detail</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="page-wrap">
    <div class="td-app">
      <div class="shell">
        <div class="topbar">
          <a class="back" href="/">← Back</a>
          <span class="breadcrumb">Manager dashboard / <span class="current" id="td-current">…</span></span>
        </div>
        <div class="body" id="td-body">
          <div class="empty-state">Loading…</div>
        </div>
      </div>
    </div>
  </div>

  <!-- SMS simulator modal (reused from dashboard) -->
  <div class="modal-overlay" id="sms-modal" role="dialog" aria-labelledby="sms-modal-title" aria-modal="true">
    <div class="modal-card">
      <button class="modal-close" id="sms-close" aria-label="Close">×</button>
      <h3 class="modal-title" id="sms-modal-title">Manager SMS — ride-along review</h3>
      <p class="modal-sub">Simulating the SMS thread. Reply Y or N as the manager would.</p>
      <div class="sms-app" id="sms-app"></div>
    </div>
  </div>

  <script src="/posthog.js"></script>
  <script src="/sms.js"></script>
  <script src="/technician.js"></script>
</body>
</html>
